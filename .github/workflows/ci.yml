name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: secscan
          POSTGRES_PASSWORD: secscan
          POSTGRES_DB: secscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secscan -d secscan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://secscan:secscan@localhost:5432/secscan_test
      SECRET_KEY: ci-test-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend dependency audit (pip-audit)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pip-audit -r requirements.txt
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend dependency audit (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev
        continue-on-error: true
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: secscan
      POSTGRES_PASSWORD: ci-placeholder-password
      POSTGRES_DB: secscan
      DATABASE_URL: postgresql://secscan:ci-placeholder-password@db:5432/secscan
      SECRET_KEY: ci-placeholder-secret
      ADMIN_SEED_EMAIL: admin@secscan.local
      ADMIN_SEED_PASSWORD: ci-placeholder-admin-password
      USER_SEED_EMAIL: user@secscan.local
      USER_SEED_PASSWORD: ci-placeholder-user-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: docker compose config
      - name: Build images
        run: docker compose build
