[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Official KISA catalog descriptions are long Korean sentences quoted
# verbatim from the source PDF; wrapping them would hurt traceability.
"app/services/kisa_catalog_seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
