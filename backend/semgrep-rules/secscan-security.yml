rules:
  - id: secscan.java.runtime-exec
    languages: [java]
    severity: ERROR
    message: 외부 입력이 운영체제 명령 실행으로 이어지지 않도록 검증과 허용 목록을 적용하세요.
    metadata:
      secscan_basis: CWE-78, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              public $RET $METHOD(..., String $PARAM, ...) { ... }
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: Runtime.getRuntime().exec($COMMAND)

  - id: secscan.javascript.eval
    languages: [javascript]
    severity: ERROR
    message: 신뢰할 수 없는 문자열을 eval로 실행하지 마세요.
    metadata:
      secscan_basis: CWE-95, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              function $FUNC(..., $PARAM, ...) { ... }
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: eval($CODE)

  - id: secscan.python.pickle-loads
    languages: [python]
    severity: ERROR
    message: 신뢰할 수 없는 직렬화 데이터는 pickle로 역직렬화하지 마세요.
    metadata:
      secscan_basis: CWE-502, OWASP A08:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              def $FUNC(..., $PARAM, ...):
                  ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: pickle.loads($DATA)
