rules:
  - id: secscan.java.runtime-exec
    languages: [java]
    severity: ERROR
    message: 외부 입력이 운영체제 명령 실행으로 이어지지 않도록 검증과 허용 목록을 적용하세요.
    metadata:
      secscan_basis: CWE-78, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              public $RET $METHOD(..., String $PARAM, ...) { ... }
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: Runtime.getRuntime().exec($COMMAND)

  - id: secscan.javascript.eval
    languages: [javascript]
    severity: ERROR
    message: 신뢰할 수 없는 문자열을 eval로 실행하지 마세요.
    metadata:
      secscan_basis: CWE-95, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              function $FUNC(..., $PARAM, ...) { ... }
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: eval($CODE)

  - id: secscan.python.pickle-loads
    languages: [python]
    severity: ERROR
    message: 신뢰할 수 없는 직렬화 데이터는 pickle로 역직렬화하지 마세요.
    metadata:
      secscan_basis: CWE-502, OWASP A08:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              def $FUNC(..., $PARAM, ...):
                  ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: pickle.loads($DATA)

  - id: secscan.java.jdbc-statement-sql
    languages: [java]
    severity: ERROR
    message: 외부 입력을 SQL 문자열로 실행하지 말고 PreparedStatement 바인딩을 사용하세요.
    metadata:
      secscan_basis: CWE-89, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: |
                  public $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  protected $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  private $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  static $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  public static $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  protected static $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  private static $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  $RET $METHOD(..., String $PARAM, ...) { ... }
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern-either:
          - pattern: $STATEMENT.executeQuery($SQL)
          - pattern: $STATEMENT.executeUpdate($SQL)

  - id: secscan.javascript.dom-innerhtml
    languages: [javascript]
    severity: ERROR
    message: 신뢰할 수 없는 값을 innerHTML에 직접 대입하지 마세요.
    metadata:
      secscan_basis: CWE-79, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: |
                  function $FUNC(..., $PARAM, ...) { ... }
              - pattern: |
                  function ($PARAM) { ... }
              - pattern: |
                  function ($PARAM, ...) { ... }
              - pattern: |
                  function ($FIRST, ..., $PARAM, ...) { ... }
              - pattern: |
                  async function $FUNC(..., $PARAM, ...) { ... }
              - pattern: |
                  $FUNC = async function ($PARAM, ...) { ... }
              - pattern: |
                  $FUNC = async function ($FIRST, ..., $PARAM, ...) { ... }
              - pattern: |
                  ($PARAM) => { ... }
              - pattern: |
                  ($PARAM, ...) => { ... }
              - pattern: |
                  ($FIRST, ..., $PARAM, ...) => { ... }
              - pattern: |
                  $PARAM => { ... }
              - pattern: |
                  ($PARAM) => $BODY
              - pattern: |
                  ($PARAM, ...) => $BODY
              - pattern: |
                  ($FIRST, ..., $PARAM, ...) => $BODY
              - pattern: |
                  $PARAM => $BODY
              - pattern: |
                  async ($PARAM) => { ... }
              - pattern: |
                  async ($PARAM, ...) => { ... }
              - pattern: |
                  async ($FIRST, ..., $PARAM, ...) => { ... }
              - pattern: |
                  async $PARAM => { ... }
              - pattern: |
                  async ($PARAM) => $BODY
              - pattern: |
                  async ($PARAM, ...) => $BODY
              - pattern: |
                  async ($FIRST, ..., $PARAM, ...) => $BODY
              - pattern: |
                  async $PARAM => $BODY
              - pattern: |
                  class $CLASS {
                    ...
                    $METHOD(..., $PARAM, ...) { ... }
                    ...
                  }
              - pattern: |
                  class $CLASS {
                    ...
                    async $METHOD(..., $PARAM, ...) { ... }
                    ...
                  }
              - pattern: |
                  {
                    ...
                    $METHOD(..., $PARAM, ...) { ... }
                    ...
                  }
          - focus-metavariable: $PARAM
    pattern-sinks:
      - patterns:
          - pattern: $ELEMENT.innerHTML = $DATA
          - focus-metavariable: $DATA

  - id: secscan.python.open-user-path
    languages: [python]
    severity: ERROR
    message: 외부 입력 경로로 파일을 열지 말고 서버 관리 경로와 허용 목록을 사용하세요.
    metadata:
      secscan_basis: CWE-22, OWASP A01:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: |
                  def $FUNC(..., $PARAM, ...):
                      ...
              - pattern: |
                  async def $FUNC(..., $PARAM, ...):
                      ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: open($PATH, ...)

  - id: secscan.python.os-system
    languages: [python]
    severity: ERROR
    message: 외부 입력을 os.system으로 실행하지 말고 허용 목록 기반 명령 실행을 사용하세요.
    metadata:
      secscan_basis: CWE-78, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              def $FUNC(..., $PARAM, ...):
                  ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - patterns:
          - pattern: os.system($COMMAND)
          - pattern-inside: |
              import os
              ...

  - id: secscan.python.eval
    languages: [python]
    severity: ERROR
    message: 신뢰할 수 없는 문자열을 eval로 실행하지 마세요.
    metadata:
      secscan_basis: CWE-95, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              def $FUNC(..., $PARAM, ...):
                  ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: eval($CODE)

  - id: secscan.python.exec
    languages: [python]
    severity: ERROR
    message: 신뢰할 수 없는 문자열을 exec로 실행하지 마세요.
    metadata:
      secscan_basis: CWE-95, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              def $FUNC(..., $PARAM, ...):
                  ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: exec($CODE)

  - id: secscan.python.pickle-load
    languages: [python]
    severity: ERROR
    message: 신뢰할 수 없는 데이터를 pickle.load로 역직렬화하지 마세요.
    metadata:
      secscan_basis: CWE-502, OWASP A08:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: |
                  def $FUNC(..., $PARAM, ...):
                      ...
              - pattern: |
                  async def $FUNC(..., $PARAM, ...):
                      ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: pickle.load($DATA)

  - id: secscan.python.path-open
    languages: [python]
    severity: ERROR
    message: 외부 입력 경로로 Path.open을 사용하지 말고 서버 관리 경로와 허용 목록을 사용하세요.
    metadata:
      secscan_basis: CWE-22, OWASP A01:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: |
                  def $FUNC(..., $PARAM, ...):
                      ...
              - pattern: |
                  async def $FUNC(..., $PARAM, ...):
                      ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: Path($PATH).open(...)

  - id: secscan.javascript.function-constructor
    languages: [javascript]
    severity: ERROR
    message: 신뢰할 수 없는 문자열로 Function 생성자를 사용하지 마세요.
    metadata:
      secscan_basis: CWE-95, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              function $FUNC(..., $PARAM, ...) { ... }
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern-either:
          - pattern: Function($CODE)
          - pattern: new Function($CODE)

  - id: secscan.javascript.dom-insert-adjacent-html
    languages: [javascript]
    severity: ERROR
    message: 신뢰할 수 없는 값을 insertAdjacentHTML의 HTML 인자에 사용하지 마세요.
    metadata:
      secscan_basis: CWE-79, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              function $FUNC(..., $PARAM, ...) { ... }
          - focus-metavariable: $PARAM
    pattern-sinks:
      - patterns:
          - pattern: $ELEMENT.insertAdjacentHTML($POSITION, $DATA)
          - focus-metavariable: $DATA

  - id: secscan.java.process-builder
    languages: [java]
    severity: ERROR
    message: 외부 입력으로 ProcessBuilder를 생성하지 말고 허용 목록 기반 명령 실행을 사용하세요.
    metadata:
      secscan_basis: CWE-78, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: |
                  public $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  protected $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  private $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  static $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  public static $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  protected static $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  private static $RET $METHOD(..., String $PARAM, ...) { ... }
              - pattern: |
                  $RET $METHOD(..., String $PARAM, ...) { ... }
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: new ProcessBuilder($COMMAND).start()

  - id: secscan.python.subprocess-run-shell
    languages: [python]
    severity: ERROR
    message: 외부 입력을 shell=True로 실행하지 말고 허용 목록 기반 명령 실행을 사용하세요.
    metadata:
      secscan_basis: CWE-78, OWASP A03:2021
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: |
                  def $FUNC(..., $PARAM, ...):
                      ...
              - pattern: |
                  async def $FUNC(..., $PARAM, ...):
                      ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - patterns:
          - pattern: subprocess.run($COMMAND, ..., shell=True, ...)
          - pattern-inside: |
              import subprocess
              ...
      - patterns:
          - pattern: $SP.run($COMMAND, ..., shell=True, ...)
          - pattern-inside: |
              import subprocess as $SP
              ...
      - patterns:
          - pattern: run($COMMAND, ..., shell=True, ...)
          - pattern-inside: |
              from subprocess import run
              ...
